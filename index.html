<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>🌼 Onam Odyssey — Maveli Run</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061d14;font-family:Inter,system-ui,Segoe UI,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:fixed;z-index:5;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.brand,.stats{display:flex;gap:8px;align-items:center}.brand{background:#073522dd;border:1px solid #d7af45;border-radius:18px;padding:8px 12px;color:#fff}.brand .flower{font-size:25px}.brand strong{display:block;color:#ffe37b;font-size:18px;line-height:1}.brand small{color:#cde0d1;font-weight:700}.stats .card{min-width:74px;text-align:center;background:#073522e8;border:1px solid #8d9d67;border-radius:14px;padding:6px 9px;color:#fff}.card span{display:block;font-size:9px;font-weight:900;color:#c8dbce}.card b{font-size:18px;color:#ffe37b}.progress{position:fixed;z-index:6;top:76px;left:50%;transform:translateX(-50%);width:min(390px,52vw);height:7px;background:#0b3827;border:1px solid #55705b;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8b842,#fff09a);box-shadow:0 0 12px #ffe37b}.controls{position:fixed;z-index:6;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:9px}.controls button,.menu button{border:2px solid #a77b21;border-radius:15px;background:linear-gradient(#ffe782,#dcae39);color:#3b2806;font-weight:1000;padding:13px 18px;min-width:72px;box-shadow:0 4px #785719;touch-action:none}.controls button:active,.menu button:active{transform:translateY(3px);box-shadow:0 1px #785719}.controls .jump{min-width:100px}.overlay{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:linear-gradient(#03150dbb,#061e14d9);backdrop-filter:blur(5px)}.overlay.hidden{display:none}.menu{width:min(650px,92vw);text-align:center;padding:30px 25px;border:3px solid #d4a83b;border-radius:28px;background:linear-gradient(145deg,#fff7d8,#ead08a);color:#183526;box-shadow:0 25px 70px #000a}.menu .onam{font-size:18px;font-weight:1000;color:#8a3b29}.menu h1{margin:4px 0;color:#7c3025;font-size:clamp(32px,6vw,55px)}.menu p{font-weight:700;line-height:1.5}.menu button{width:min(360px,100%);font-size:17px}.tips{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:15px}.tips span{padding:6px 10px;border:1px solid #bb9440;border-radius:99px;font-size:10px;font-weight:900}.toast{position:fixed;z-index:12;left:50%;bottom:105px;transform:translateX(-50%);padding:9px 16px;border-radius:99px;background:#052d1cdd;border:1px solid #e0b644;color:#ffe27a;font-weight:1000;opacity:0;transition:.18s;pointer-events:none}.toast.show{opacity:1}.error{color:#8c3429!important}@media(max-width:650px){.hud{top:7px;left:7px;right:7px}.brand{padding:6px 9px}.brand strong{font-size:14px}.brand small{display:none}.brand .flower{font-size:20px}.stats{gap:4px}.stats .card{min-width:58px;padding:5px}.card b{font-size:14px}.progress{top:63px;width:55vw}.controls{bottom:10px;gap:6px}.controls button{padding:12px 10px;min-width:65px}.controls .jump{min-width:84px}.menu{padding:22px 16px}.menu h1{font-size:36px}.menu p{font-size:13px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
</head>
<body>
<div id="game"></div>
<div class="hud"><div class="brand"><div class="flower">🌼</div><div><strong>ONAM ODYSSEY</strong><small>Maveli Run • Kerala Edition</small></div></div><div class="stats"><div class="card"><span>FLOWERS</span><b id="flowers">0</b></div><div class="card"><span>SCORE</span><b id="score">0</b></div><div class="card"><span>SPEED</span><b id="speed">1.0x</b></div></div></div>
<div class="progress"><i id="progress"></i></div>
<div class="controls"><button data-act="left">◀</button><button data-act="right">▶</button><button class="jump" data-act="jump">JUMP ⤴</button></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="menu"><div class="onam">ഓണാശംസകൾ</div><h1 id="title">MAVELI RUN</h1><p id="description">Run through a Kerala Onam festival road, dodge moving trains and barricades, jump onto train roofs, and collect glowing flowers and golden umbrellas.</p><button id="start">START RUN</button><div class="tips"><span>← → / A D — MOVE</span><span>SPACE / W / ↑ — JUMP</span><span>SWIPE — MOVE / JUMP</span></div></div></div>
<script>
(() => {
'use strict';
const root=document.getElementById('game'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');
const flowersEl=document.getElementById('flowers'),scoreEl=document.getElementById('score'),speedEl=document.getElementById('speed'),progressEl=document.getElementById('progress'),toastEl=document.getElementById('toast');
let scene,camera,renderer,maveli,gameRunning=false,lastTime=0,shake=0;let lane=1,targetLane=1,jumpY=0,jumpV=0,flowers=0,score=0,distance=0,speed=10,gameOver=false;const objects=[],particles=[];const laneX=[-2.5,0,2.5];const textureLoader=new THREE.TextureLoader();const assets={maveli:'assets/maveli.svg',umbrella:'assets/umbrella.svg',coconut:'assets/coconut.svg'};const tex={};
function ui(){flowersEl.textContent=flowers;scoreEl.textContent=Math.floor(score);speedEl.textContent=(speed/10).toFixed(1)+'x';progressEl.style.width=Math.min(100,distance/5000*100)+'%'}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),1100)}
function mat(color,rough=.8,metal=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal})}
function box(w,h,d,color){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color))}
function addGlow(mesh){mesh.material.emissive=new THREE.Color(0x7b4f00);mesh.material.emissiveIntensity=.65}
function loadTexture(url){return new Promise((resolve,reject)=>textureLoader.load(url,t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());resolve(t)},undefined,reject))}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x7fd2e5);scene.fog=new THREE.Fog(0x7fd2e5,24,105);camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,250);camera.position.set(0,5.2,10.5);camera.lookAt(0,2,-12);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);const hemi=new THREE.HemisphereLight(0xfff2cf,0x315f3b,2);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff2cf,3);sun.position.set(-12,22,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.near=1;sun.shadow.camera.far=90;sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-15;scene.add(sun);buildWorld();createMaveli();Promise.all(Object.entries(assets).map(async([k,u])=>[k,await loadTexture(u)])).then(entries=>{entries.forEach(([k,t])=>tex[k]=t);createMaveli()}).catch(()=>{});window.addEventListener('resize',resize);window.addEventListener('keydown',key);bindTouch();ui();drawPreview()}
function buildWorld(){const ground=box(30,.35,220,0x397642);ground.position.set(0,-.3,-70);ground.receiveShadow=true;scene.add(ground);const road=box(9,.16,220,0x6e4b2b);road.position.set(0,-.08,-70);road.receiveShadow=true;scene.add(road);for(const x of [-1.25,1.25]){const line=box(.07,.025,220,0xf5dc8b);line.position.set(x,.02,-70);scene.add(line)}for(let z=-2;z>-205;z-=9){const strip=box(8,.03,.18,0xc69a51);strip.position.set(0,.03,z);scene.add(strip)}const gate=new THREE.Group();gate.position.set(0,0,-125);scene.add(gate);const p1=box(1.4,7,1.4,0xc9932f),p2=box(1.4,7,1.4,0xc9932f),beam=box(9,1.3,1.1,0xe2b846);p1.position.x=-4;p1.position.y=3.5;p2.position.x=4;p2.position.y=3.5;beam.position.y=7;[p1,p2,beam].forEach(m=>{m.castShadow=true;gate.add(m)});const roof=new THREE.ConeGeometry(5.8,3.8,4);const rm=new THREE.Mesh(roof,mat(0xa63d2e));const r2=rm.clone();rm.rotation.y=Math.PI/4;r2.rotation.y=Math.PI/4;rm.position.y=9;r2.position.y=11.2;r2.scale.set(.7,.65,.7);gate.add(rm,r2);for(let i=0;i<24;i++)addPalm((i%6-2.5)*7,-10-i*7-(i%3)*18,i%2?1:-1);for(let i=0;i<26;i++)addLamp((i%2?1:-1)*(5.5+(i%3)*2.5),-5-i*7)}
function addPalm(x,z,side){const g=new THREE.Group();g.position.set(x,0,z);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.13,.28,3.8,8),mat(0x6e4b2b));trunk.position.y=1.9;trunk.rotation.z=side*.08;g.add(trunk);for(let a=0;a<6;a++){const leaf=new THREE.Mesh(new THREE.ConeGeometry(.18,2.6,5),mat(a%2?0x2d7542:0x3f8b4c));leaf.position.y=3.8;leaf.rotation.z=.75;leaf.rotation.y=a*Math.PI/3;g.add(leaf)}scene.add(g)}
function addLamp(x,z){const g=new THREE.Group();g.position.set(x,0,z);const pole=box(.08,2.3,.08,0x5b4024);pole.position.y=1.15;const lamp=new THREE.Mesh(new THREE.SphereGeometry(.2,12,8),new THREE.MeshStandardMaterial({color:0xffe27a,emissive:0xffb21e,emissiveIntensity:2}));lamp.position.y=2.35;g.add(pole,lamp);scene.add(g)}
function createMaveli(){if(maveli)scene.remove(maveli);maveli=new THREE.Group();maveli.position.set(0,0,4);maveli.scale.setScalar(2.25);if(tex.maveli){const m=new THREE.SpriteMaterial({map:tex.maveli,transparent:true,depthWrite:false});const s=new THREE.Sprite(m);s.scale.set(1.72,2.29,1);s.position.y=1.2;maveli.add(s)}else{const body=new THREE.Mesh(new THREE.CapsuleGeometry(.35,.75,8,16),mat(0x1e7148));body.position.y=1;body.castShadow=true;maveli.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.38,20,20),mat(0xb96e43));head.position.y=1.9;maveli.add(head);const crown=new THREE.Mesh(new THREE.ConeGeometry(.38,.5,8),mat(0xe1b83d));crown.position.y=2.45;maveli.add(crown)}scene.add(maveli)}
function train(){const g=new THREE.Group();g.userData.type='train';g.userData.hit=false;g.userData.lane=Math.floor(Math.random()*3);g.position.set(laneX[g.userData.lane],0,-82);const body=box(2.65,1.55,5.6,0xb9362d);body.position.y=.9;body.castShadow=true;g.add(body);const roof=box(2.9,.18,5.8,0xd9a33d);roof.position.y=1.78;roof.castShadow=true;g.add(roof);for(const x of [-.75,.75]){const win=box(.6,.45,.08,0x92d8e5);win.position.set(x,1.12,2.82);g.add(win)}for(const z of [-1.7,0,1.7])for(const x of [-1.12,1.12]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.2,16),mat(0x24211d));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.35,z);g.add(wheel)}const head=new THREE.Mesh(new THREE.SphereGeometry(.22,12,8),new THREE.MeshStandardMaterial({color:0xffe16e,emissive:0xffb21e,emissiveIntensity:1.4}));head.position.set(0,1.05,2.88);g.add(head);scene.add(g);objects.push(g)}
function barricade(){const g=new THREE.Group();g.userData.type='barricade';g.userData.lane=Math.floor(Math.random()*3);g.position.set(laneX[g.userData.lane],0,-82);const a=box(2.1,.28,.3,0xe5b83e),b=box(2.1,.28,.3,0x9d342a);a.position.y=.75;a.rotation.z=.12;b.position.y=1.05;b.rotation.z=-.12;g.add(a,b);const leg=box(.18,.9,.18,0x6d4224);leg.position.set(-.75,.45,0);g.add(leg,leg.clone());scene.add(g);objects.push(g)}
function collectible(type='flower',laneIndex=Math.floor(Math.random()*3),z=-82,y=1.25){const g=new THREE.Group();g.userData.type='collect';g.userData.lane=laneIndex;g.userData.collected=false;g.position.set(laneX[laneIndex],y,z);if(type==='umbrella'&&tex.umbrella){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex.umbrella,transparent:true,depthWrite:false}));s.scale.set(.9,.9,1);g.add(s)}else{const tor=new THREE.Mesh(new THREE.TorusGeometry(.34,.11,12,24),mat(0xffc93f,.35,.1));addGlow(tor);g.add(tor);for(let i=0;i<6;i++){const pet=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),mat(i%2?0xffd84a:0xfff1a1));pet.position.set(Math.cos(i*Math.PI/3)*.32,Math.sin(i*Math.PI/3)*.32,0);g.add(pet)}}scene.add(g);objects.push(g)}
function coconut(){const g=new THREE.Group();g.userData.type='coconut';g.userData.lane=Math.floor(Math.random()*3);g.position.set(laneX[g.userData.lane],.65,-82);const s=tex.coconut?new THREE.Sprite(new THREE.SpriteMaterial({map:tex.coconut,transparent:true})):new THREE.Mesh(new THREE.SphereGeometry(.48,16,16),mat(0x6d4024));s.scale.set(.85,.85,1);g.add(s);scene.add(g);objects.push(g)}
function spawn(){const r=Math.random();if(r<.52)train();else if(r<.72)barricade();else coconut();const laneIndex=Math.floor(Math.random()*3);collectible(Math.random()<.16?'umbrella':'flower',laneIndex,-88,r<.52?2.15:1.25);if(Math.random()<.45)collectible('flower',(laneIndex+1)%3,-96,1.3)}
function move(dt){const dx=laneX[targetLane]-maveli.position.x;maveli.position.x+=dx*Math.min(1,dt*9);if(jumpV!==0||jumpY>0){jumpY+=jumpV*dt;jumpV-=25*dt;if(jumpY<=0){jumpY=0;jumpV=0}}maveli.position.y=jumpY;maveli.rotation.z+=(laneX[targetLane]-maveli.position.x)*-.03;for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.position.z+=speed*dt*(o.userData.type==='train'?1:1.05);if(o.userData.type==='collect')o.rotation.y+=dt*4;if(o.userData.type==='coconut')o.rotation.z+=dt*7;const sameLane=Math.abs(o.position.x-maveli.position.x)<1.05;const dz=Math.abs(o.position.z-maveli.position.z);if(o.userData.type==='collect'&&!o.userData.collected&&sameLane&&dz<1.35&&Math.abs(o.position.y-(maveli.position.y+1.25))<1.6){o.userData.collected=true;const umbrella=Boolean(o.children[0]?.material?.map&&o.children[0].material.map===tex.umbrella);flowers+=umbrella?3:1;score+=umbrella?75:25;burst(o.position.clone(),0xffe16e);scene.remove(o);objects.splice(i,1);continue}if((o.userData.type==='train'||o.userData.type==='barricade'||o.userData.type==='coconut')&&!o.userData.hit&&sameLane&&dz<1.9){const safeJump=o.userData.type==='train'?maveli.position.y>2.0:maveli.position.y>1.15;if(!safeJump){o.userData.hit=true;hit()}}if(o.position.z>14){scene.remove(o);objects.splice(i,1)}}if(Math.random()<dt*.045)spawn();distance+=speed*dt;score+=dt*8;speed=Math.min(20,10+distance*.0017);ui()}
function jump(){if(!gameRunning)return;if(jumpY<=.01){jumpV=10.5;toast('MAVELI JUMPS!')}}
function moveLane(d){if(!gameRunning)return;targetLane=Math.max(0,Math.min(2,targetLane+d))}
function hit(){gameOver=true;gameRunning=false;shake=.45;burst(maveli.position.clone(),0xff7043,24);showEnd('CAUGHT!','Maveli hit a festival hazard. Jump over trains and barricades, or change lanes.','RUN AGAIN')}
function showEnd(t,d,b){document.getElementById('title').textContent=t;document.getElementById('description').innerHTML=d+'<br><b>Score: '+Math.floor(score)+' • Flowers: '+flowers+'</b>';startBtn.textContent=b;overlay.classList.remove('hidden')}
function reset(){objects.splice(0).forEach(o=>scene.remove(o));particles.splice(0);lane=targetLane=1;flowers=0;score=0;distance=0;speed=10;jumpY=jumpV=0;gameOver=false;shake=0;maveli.position.set(0,0,4);ui()}
function start(){reset();overlay.classList.add('hidden');gameRunning=true;lastTime=performance.now();for(let i=0;i<4;i++)spawn();requestAnimationFrame(loop)}
function drawPreview(){renderer.render(scene,camera)}
function burst(pos,color=0xffe16e,count=16){for(let i=0;i<count;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.035,6,6),new THREE.MeshBasicMaterial({color,transparent:true}));p.position.copy(pos);p.userData.v=new THREE.Vector3((Math.random()-.5)*4,Math.random()*4,(Math.random()-.5)*4);p.userData.life=.5+Math.random()*.5;scene.add(p);particles.push(p)}}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.position.addScaledVector(p.userData.v,dt);p.userData.v.y-=8*dt;p.userData.life-=dt;p.material.opacity=Math.max(0,p.userData.life);if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}}}
function loop(now){if(!gameRunning)return;const dt=Math.min(.033,Math.max(0,(now-lastTime)/1000));lastTime=now;move(dt);updateParticles(dt);if(shake>0)shake-=dt;camera.position.x+=(shake>0?(Math.random()-.5)*.35:-camera.position.x)*Math.min(1,dt*15);renderer.render(scene,camera);requestAnimationFrame(loop)}
function resize(){if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75))}
function key(e){const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','a','d','w'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')moveLane(-1);if(k==='arrowright'||k==='d')moveLane(1);if(k==='arrowup'||k==='w'||k===' ')jump()}
function bindTouch(){document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const a=b.dataset.act;if(a==='left')moveLane(-1);if(a==='right')moveLane(1);if(a==='jump')jump()},{passive:false}));let sx=0,sy=0;renderer.domElement.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});renderer.domElement.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>35)moveLane(dx>0?1:-1);else if(dy<-25)jump()},{passive:true})}
startBtn.addEventListener('click',start);
try{init()}catch(err){console.error(err);document.getElementById('description').innerHTML='<span class="error">WebGL could not start. Please use a modern Chrome, Edge, Firefox or Safari browser.</span>';startBtn.textContent='RELOAD';startBtn.onclick=()=>location.reload()}
})();
</script>
</body>
</html>
