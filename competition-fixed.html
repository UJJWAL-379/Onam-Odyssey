<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Onam Odyssey</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79cfe0;font-family:system-ui}#game{position:fixed;inset:0}.hud{position:fixed;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;color:white;font-weight:900;pointer-events:none}.card{background:#052a1cdd;border:1px solid #d4a83b;border-radius:12px;padding:6px 10px;margin-left:5px}.stats{display:flex}.overlay{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#03150dcc}.menu{text-align:center;width:min(620px,90vw);padding:30px;border:3px solid #d4a83b;border-radius:25px;background:#fff1c5;color:#183526}.menu h1{font-size:48px;color:#7c3025;margin:5px}.menu button,.controls button{border:2px solid #a77b21;border-radius:14px;background:linear-gradient(#ffe782,#dcae39);font-weight:1000;padding:13px 20px}.menu button{font-size:18px;width:80%}.hidden{display:none!important}.controls{position:fixed;z-index:6;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.controls button{min-width:70px}.jump{min-width:100px!important}.pause{position:fixed;right:12px;bottom:15px;z-index:7}.toast{position:fixed;z-index:10;bottom:95px;left:50%;transform:translateX(-50%);background:#052d1cdd;color:#ffe27a;padding:9px 16px;border-radius:20px;opacity:0}.toast.show{opacity:1}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/loaders/GLTFLoader.js"></script></head><body><div id="game"></div><div class="hud"><div>🌼 ONAM ODYSSEY<br><small>Maveli Run</small></div><div class="stats"><div class="card">FLOWERS <span id="flowers">0</span></div><div class="card">SCORE <span id="score">0</span></div><div class="card">SPEED <span id="speed">1.0x</span></div></div></div><div class="controls"><button data-a="l">◀</button><button class="jump" data-a="j">JUMP ⤴</button><button data-a="r">▶</button></div><button id="pause" class="pause hidden">Ⅱ</button><div id="toast" class="toast"></div><div id="overlay" class="overlay"><div class="menu"><div>ഓണാശംസകൾ</div><h1>MAVELI RUN</h1><p>Run through Kerala, dodge trains and barricades, collect flowers and survive the Vamana encounter.</p><button id="startBtn">START RUN</button></div></div><script>
(function(){'use strict';
var root=document.getElementById('game'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),pauseBtn=document.getElementById('pause'),flowersEl=document.getElementById('flowers'),scoreEl=document.getElementById('score'),speedEl=document.getElementById('speed'),toastEl=document.getElementById('toast');
var scene,camera,renderer,maveli,foot,last=0,spawnClock=0,runClock=0,state='MENU',score=0,flowers=0,speed=10,distance=0,targetLane=1,jumpY=0,jumpV=0,bossTime=0;var lanes=[-2.5,0,2.5],objects=[];
function material(c){return new THREE.MeshStandardMaterial({color:c,roughness:.8})}function box(w,h,d,c){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(c))}function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(function(){toastEl.classList.remove('show')},900)}function ui(){flowersEl.textContent=flowers;scoreEl.textContent=Math.floor(score);speedEl.textContent=(speed/10).toFixed(1)+'x'}
function makeMaveli(){maveli=new THREE.Group();maveli.position.set(0,0,4);var body=new THREE.Mesh(new THREE.CapsuleGeometry(.5,.9,8,16),material(0x1d7046));body.position.y=1.05;var dhoti=new THREE.Mesh(new THREE.CylinderGeometry(.65,.8,.55,16),material(0xf2dfb0));dhoti.position.y=.55;var head=new THREE.Mesh(new THREE.SphereGeometry(.43,18,14),material(0xb96d43));head.position.y=2.02;var crown=new THREE.Mesh(new THREE.ConeGeometry(.45,.6,8),material(0xe1b83d));crown.position.y=2.6;maveli.add(body,dhoti,head,crown);scene.add(maveli);loadMaveliGLTF()}
function loadMaveliGLTF(){var l=new THREE.GLTFLoader();l.load('assets/maveli.gltf',function(g){var model=g.scene;var b=new THREE.Box3().setFromObject(model),s=b.getSize(new THREE.Vector3());model.scale.setScalar(3.15/Math.max(.01,s.y));model.position.set(0,0,0);model.rotation.y=Math.PI;model.traverse(function(o){if(o.isMesh){o.castShadow=true;o.material.side=THREE.DoubleSide}});scene.remove(maveli);maveli=model;scene.add(maveli);toast('MAVELI READY')},undefined,function(e){console.warn('Maveli GLTF failed; using visible fallback',e)})}
function makeBoss(){foot=new THREE.Group();foot.position.set(0,45,-28);var leg=new THREE.Mesh(new THREE.CylinderGeometry(2.8,3.4,20,24),material(0xc88755));leg.position.y=10;var sole=new THREE.Mesh(new THREE.BoxGeometry(6,2,7),material(0xc88755));sole.position.y=0;foot.add(leg,sole);scene.add(foot)}
function world(){var grass=box(36,.4,250,0x367543);grass.position.set(0,-.35,-90);scene.add(grass);var road=box(9,.2,250,0x5b4029);road.position.set(0,-.1,-90);scene.add(road);for(var x of[-1.25,1.25]){var line=box(.06,.03,250,0xf4dc91);line.position.set(x,.03,-90);scene.add(line)}for(var z=0;z>-230;z-=8){var dash=box(8,.035,.22,0xc69b52);dash.position.set(0,.04,z);scene.add(dash)}}
function obstacle(){var l=Math.floor(Math.random()*3),g=box(2.4,1.5,3,0x345b9b);g.position.set(lanes[l],.75,-85);g.userData={type:'train',hit:false};scene.add(g);objects.push(g);var f=new THREE.Mesh(new THREE.TorusGeometry(.3,.1,10,20),material(0xffcf45));f.position.set(lanes[l],1.5,-96);f.userData={type:'flower',hit:false};scene.add(f);objects.push(f)}
function pbox(){return new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(maveli.position.x,jumpY+1.45,4),new THREE.Vector3(1,2.7,.8))}function hit(o){return pbox().intersectsBox(new THREE.Box3().setFromObject(o))}
function startGame(){state='RUNNING';overlay.classList.add('hidden');pauseBtn.classList.remove('hidden');score=0;flowers=0;distance=0;speed=10;targetLane=1;jumpY=0;jumpV=0;spawnClock=0;runClock=0;objects.forEach(function(o){scene.remove(o)});objects.length=0;maveli.position.set(0,0,4);last=performance.now();for(var i=0;i<4;i++)obstacle();ui();requestAnimationFrame(loop)}window.startGame=startGame;startBtn.addEventListener('click',startGame);
function jump(){if(state==='RUNNING'&&jumpY===0){jumpV=10.8;toast('JUMP!')}}function move(d){if(state==='RUNNING')targetLane=Math.max(0,Math.min(2,targetLane+d))}function togglePause(){if(state==='RUNNING'){state='PAUSED';overlay.classList.remove('hidden');pauseBtn.classList.add('hidden');startBtn.textContent='RESUME';overlay.querySelector('h1').textContent='PAUSED'}else if(state==='PAUSED'){state='RUNNING';overlay.classList.add('hidden');pauseBtn.classList.remove('hidden');startBtn.textContent='START RUN';last=performance.now();requestAnimationFrame(loop)}}
function loop(now){if(state!=='RUNNING'&&state!=='BOSS')return;var dt=Math.min(.033,(now-last)/1000);last=now;runClock+=dt;if(state==='RUNNING'){var dx=lanes[targetLane]-maveli.position.x;maveli.position.x+=dx*Math.min(1,dt*10);if(jumpV||jumpY){jumpY+=jumpV*dt;jumpV-=25*dt;if(jumpY<=0){jumpY=0;jumpV=0}}maveli.position.y=jumpY+Math.sin(runClock*14)*.045;maveli.rotation.y=Math.PI+Math.sin(runClock*14)*.035;spawnClock+=dt;if(spawnClock>.75){spawnClock=0;obstacle()}for(var i=objects.length-1;i>=0;i--){var o=objects[i];o.position.z+=speed*dt;if(o.userData.type==='flower'){o.rotation.y+=dt*5;if(!o.userData.hit&&hit(o)){o.userData.hit=true;flowers++;score+=25;scene.remove(o);objects.splice(i,1);continue}}else if(!o.userData.hit&&hit(o)){if(jumpY<1.9){o.userData.hit=true;state='OVER';overlay.classList.remove('hidden');startBtn.textContent='RUN AGAIN';overlay.querySelector('h1').textContent='CAUGHT!';return}}if(o.position.z>15){scene.remove(o);objects.splice(i,1)}}distance+=speed*dt;score+=dt*8;speed=Math.min(20,10+distance*.0017);if(distance>1200){state='BOSS';bossTime=0;objects.forEach(function(o){scene.remove(o)});objects.length=0;toast('VAMANA APPROACHES')}}else{bossTime+=dt;if(bossTime<1.5)foot.position.y=45;else if(bossTime<3.2)foot.position.y=45-44*Math.pow((bossTime-1.5)/1.7,2);else if(bossTime<5)foot.position.y=1;else foot.position.y=Math.min(45,1+(bossTime-5)*20);if(bossTime>7){state='WIN';overlay.classList.remove('hidden');startBtn.textContent='PLAY AGAIN';overlay.querySelector('h1').textContent='ONAM CHAMPION!'}}ui();camera.position.x+=(lanes[targetLane]*.055-camera.position.x)*Math.min(1,dt*5);camera.lookAt(maveli.position.x*.12,1.6,-14);renderer.render(scene,camera);requestAnimationFrame(loop)}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x79cfe0);camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,280);camera.position.set(0,5.1,10.5);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;root.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xfff0cc,0x245b38,2));var sun=new THREE.DirectionalLight(0xfff2d0,3);sun.position.set(-18,28,12);sun.castShadow=true;scene.add(sun);world();makeMaveli();makeBoss();document.querySelectorAll('[data-a]').forEach(function(b){b.addEventListener('pointerdown',function(e){e.preventDefault();if(b.dataset.a==='l')move(-1);else if(b.dataset.a==='r')move(1);else jump()})});pauseBtn.addEventListener('click',togglePause);addEventListener('keydown',function(e){var k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')move(-1);if(k==='arrowright'||k==='d')move(1);if(k==='arrowup'||k==='w'||k===' ')jump();if(k==='p'||k==='escape')togglePause()});addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});ui();renderer.render(scene,camera)}init();
})();</script></body></html>
