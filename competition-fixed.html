<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Onam Odyssey — Maveli Run</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b13;font-family:system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:fixed;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.brand,.stats{display:flex;gap:7px;align-items:center}.brand{padding:8px 12px;border:1px solid #e5bd51;border-radius:18px;background:#052a1cdd;color:#fff}.brand strong{display:block;color:#ffe47b}.brand small{color:#cde0d2}.stats .card{min-width:68px;text-align:center;padding:6px 8px;border:1px solid #7e936a;border-radius:14px;background:#052a1cdd;color:#fff}.card span{display:block;font-size:9px;color:#c8dbce}.card b{font-size:17px;color:#ffe47b}.progress{position:fixed;z-index:6;top:73px;left:50%;transform:translateX(-50%);width:min(420px,55vw);height:7px;background:#0b3827;border:1px solid #55705b;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#e1ad36}.controls{position:fixed;z-index:6;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px}.controls button,.menu button{border:2px solid #a77b21;border-radius:15px;background:linear-gradient(#ffe782,#dcae39);color:#3b2806;font-weight:1000;padding:12px 17px;min-width:70px;box-shadow:0 4px #785719}.controls .jump{min-width:96px}.pause{position:fixed;right:14px;bottom:16px;display:none}.overlay{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#03150dcc;backdrop-filter:blur(6px)}.overlay.hidden{display:none}.menu{width:min(680px,92vw);text-align:center;padding:29px 24px;border:3px solid #d4a83b;border-radius:28px;background:linear-gradient(145deg,#fff7d8,#ead08a);color:#183526}.menu h1{margin:4px 0;color:#7c3025;font-size:clamp(32px,6vw,55px)}.menu p{font-weight:700;line-height:1.5}.menu button{width:min(360px,100%);font-size:17px}.tips{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:15px}.tips span{padding:6px 10px;border:1px solid #bb9440;border-radius:99px;font-size:10px;font-weight:900}.toast{position:fixed;z-index:12;left:50%;bottom:100px;transform:translateX(-50%);padding:9px 16px;border-radius:99px;background:#052d1cdd;border:1px solid #e0b644;color:#ffe27a;font-weight:1000;opacity:0}.toast.show{opacity:1}@media(max-width:650px){.hud{top:6px;left:6px;right:6px}.brand small{display:none}.stats .card{min-width:56px}.controls{bottom:9px}.controls button{padding:11px 9px;min-width:61px}.controls .jump{min-width:82px}.pause{bottom:9px;right:7px}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/loaders/GLTFLoader.js"></script></head><body><div id="game"></div><div class="hud"><div class="brand">🌼 <div><strong>ONAM ODYSSEY</strong><small>Maveli Run • Kerala Edition</small></div></div><div class="stats"><div class="card"><span>FLOWERS</span><b id="flowers">0</b></div><div class="card"><span>SCORE</span><b id="score">0</b></div><div class="card"><span>SPEED</span><b id="speed">1.0x</b></div></div></div><div class="progress"><i id="progress"></i></div><div class="controls"><button data-act="left">◀</button><button class="jump" data-act="jump">JUMP ⤴</button><button data-act="right">▶</button><button id="pause" class="pause" data-act="pause">Ⅱ</button></div><div class="toast" id="toast"></div><div class="overlay" id="overlay"><div class="menu"><div>ഓണാശംസകൾ</div><h1 id="title">MAVELI RUN</h1><p id="description">Run through Kerala, dodge trains and festival obstacles, collect pookalam flowers and survive the Vamana encounter.</p><button id="start">START RUN</button><div class="tips"><span>← → / A D — MOVE</span><span>SPACE / W / ↑ — JUMP</span><span>SWIPE — MOVE / JUMP</span></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),root=$('game'),overlay=$('overlay'),startBtn=$('start'),title=$('title'),desc=$('description'),flowersEl=$('flowers'),scoreEl=$('score'),speedEl=$('speed'),progress=$('progress'),toastEl=$('toast'),pauseBtn=$('pause');const STATE={MENU:0,RUNNING:1,BOSS:2,PAUSED:3,OVER:4,WIN:5};let state=STATE.MENU,scene,camera,renderer,maveli,foot,shadow,models={},last=0,spawnClock=0,bossClock=0,runClock=0,score=0,flowers=0,distance=0,speed=10,lane=1,targetLane=1,jumpY=0,jumpV=0,shake=0;const lanes=[-2.5,0,2.5],objects=[],particles=[];const loader=new THREE.GLTFLoader();const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),1000)}function ui(){flowersEl.textContent=flowers;scoreEl.textContent=Math.floor(score);speedEl.textContent=(speed/10).toFixed(1)+'x';progress.style.width=Math.min(100,distance/1200*100)+'%'}function asset(k,p){return new Promise((res,rej)=>loader.load(p,g=>res(g.scene),undefined,rej))}function addLights(){scene.add(new THREE.HemisphereLight(0xfff0cc,0x245b38,2));const s=new THREE.DirectionalLight(0xfff2d0,3);s.position.set(-18,28,12);s.castShadow=true;scene.add(s)}
function world(){const grass=box(36,.4,250,0x367543);grass.position.set(0,-.34,-90);grass.receiveShadow=true;scene.add(grass);const road=box(9,.2,250,0x5c412b);road.position.set(0,-.1,-90);road.receiveShadow=true;scene.add(road);for(const x of[-1.25,1.25]){const l=box(.06,.03,250,0xf4dc91);l.position.set(x,.03,-90);scene.add(l)}for(let z=0;z>-240;z-=8){const s=box(8,.035,.22,0xc69b52);s.position.set(0,.035,z);scene.add(s)}for(let i=0;i<24;i++){const p=new THREE.Group();p.position.set((i%2?-1:1)*(5.5+(i%4)*1.4),0,-10-i*10);const tr=box(.25,4,.25,0x6d4829);tr.position.y=2;const crown=new THREE.Mesh(new THREE.SphereGeometry(1.5,8,6),mat(0x2f6e3d));crown.position.y=4.6;p.add(tr,crown);scene.add(p)}}
function fallback(){maveli=new THREE.Group();maveli.position.set(0,0,4);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,8,16),mat(0x1d7046));body.position.y=1.1;const dhoti=new THREE.Mesh(new THREE.CylinderGeometry(.65,.8,.6,16),mat(0xf2dfb0));dhoti.position.y=.55;const head=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),mat(0xb96d43));head.position.y=2.05;const crown=new THREE.Mesh(new THREE.ConeGeometry(.44,.58,8),mat(0xe1b83d,.3,.45));crown.position.y=2.58;maveli.add(body,dhoti,head,crown);scene.add(maveli)}
function useMaveli(model){if(!model)return;if(maveli)scene.remove(maveli);maveli=model.clone(true);const b=new THREE.Box3().setFromObject(maveli),size=b.getSize(new THREE.Vector3());maveli.scale.setScalar(3.25/Math.max(size.y,.01));maveli.position.set(0,0,4);maveli.rotation.y=Math.PI;maveli.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.material.side=THREE.DoubleSide}});scene.add(maveli);toast('MAVELI READY!')}
function createFoot(){foot=new THREE.Group();foot.position.set(0,45,-28);const leg=new THREE.Mesh(new THREE.BoxGeometry(4,8,3.8),mat(0xc88755));leg.position.y=5;const sole=new THREE.Mesh(new THREE.BoxGeometry(5.5,2.2,7),mat(0xc88755));const band=new THREE.Mesh(new THREE.BoxGeometry(5.8,.3,7.4),mat(0xe0b63c,.3,.4));band.position.y=1.15;foot.add(leg,sole,band);scene.add(foot);shadow=new THREE.Mesh(new THREE.CircleGeometry(4,40),new THREE.MeshBasicMaterial({color:0x160b08,transparent:true,opacity:0,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.set(0,.025,-28);scene.add(shadow)}
function model(type,l,z){if(!models[type])return null;const g=models[type].clone(true);g.position.set(lanes[l],0,z);g.userData={type,lane:l,hit:false};g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(g);objects.push(g);return g}function barricade(l,z){const g=new THREE.Group();g.position.set(lanes[l],0,z);g.userData={type:'bar',lane:l,hit:false};const a=box(2.1,.3,.35,0xe6b63c),b=box(2.1,.3,.35,0x9f342b);a.position.y=.75;b.position.y=1.08;g.add(a,b);scene.add(g);objects.push(g)}function flower(l,z){const g=new THREE.Mesh(new THREE.TorusGeometry(.34,.1,12,24),mat(0xffcf45,.3,.15));g.position.set(lanes[l],1.3,z);g.userData={type:'flower',collected:false};scene.add(g);objects.push(g)}function spawn(){const l=Math.floor(Math.random()*3);if(Math.random()<.5)model('train',l,-88);else barricade(l,-88);flower(l,-96);if(Math.random()<.45)flower((l+1)%3,-104)}
function pbox(){return new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(maveli.position.x,jumpY+1.45,4),new THREE.Vector3(.95,2.7,.8))}function hit(o){return pbox().intersectsBox(new THREE.Box3().setFromObject(o))}function burst(pos){for(let i=0;i<14;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.04,6,6),new THREE.MeshBasicMaterial({color:0xffe16e,transparent:true}));p.position.copy(pos);p.userData.v=new THREE.Vector3((Math.random()-.5)*4,Math.random()*4,(Math.random()-.5)*4);p.userData.life=.6;scene.add(p);particles.push(p)}}
function gameOver(t,d){state=STATE.OVER;title.textContent=t;desc.innerHTML=d+'<br><b>Score: '+Math.floor(score)+' • Flowers: '+flowers+'</b>';startBtn.textContent='RUN AGAIN';overlay.classList.remove('hidden');pauseBtn.style.display='none';burst(maveli.position)}function victory(){state=STATE.WIN;title.textContent='ONAM CHAMPION!';desc.innerHTML='Maveli completed the festival run!<br><b>Final score: '+Math.floor(score)+' • Flowers: '+flowers+'</b>';startBtn.textContent='PLAY AGAIN';overlay.classList.remove('hidden');pauseBtn.style.display='none'}
function beginBoss(){objects.splice(0).forEach(o=>scene.remove(o));state=STATE.BOSS;bossClock=0;foot.position.set(0,45,-28);shadow.material.opacity=0;toast('THE GROUND TREMBLES!')}function updateBoss(dt){bossClock+=dt;if(bossClock<1.5)foot.position.y=45;else if(bossClock<3.2){const p=(bossClock-1.5)/1.7;foot.position.y=45-44*(p*p*(3-2*p));shadow.material.opacity=.15+.7*p}else if(bossClock<4.8){foot.position.y=1;shadow.material.opacity=.9;shake=.4}else foot.position.y=Math.min(45,1+(bossClock-4.8)*28);if(bossClock>3&&bossClock<4.8&&pbox().intersectsBox(new THREE.Box3().setFromObject(foot))&&jumpY<2.25)return gameOver('VAMANA STRIKE!','Jump higher during the giant-foot stomp.');if(bossClock>7.5)victory()}
function update(dt){runClock+=dt;const dx=lanes[targetLane]-maveli.position.x;maveli.position.x+=dx*Math.min(1,dt*10);if(jumpV||jumpY){jumpY+=jumpV*dt;jumpV-=25*dt;if(jumpY<=0){jumpY=0;jumpV=0}}maveli.position.y=jumpY+Math.sin(runClock*14)*.045;maveli.rotation.y=Math.PI+Math.sin(runClock*14)*.035;spawnClock+=dt;if(spawnClock>.68){spawnClock=0;spawn()}for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.position.z+=speed*dt*(o.userData.type==='flower'?1.06:1);if(o.userData.type==='flower'){o.rotation.y+=dt*5;if(!o.userData.collected&&hit(o)){o.userData.collected=true;flowers++;score+=25;burst(o.position.clone());scene.remove(o);objects.splice(i,1);continue}}else if(!o.userData.hit&&hit(o)){const safe=o.userData.type==='train'?jumpY>1.95:jumpY>1.05;if(!safe){o.userData.hit=true;return gameOver('CAUGHT!','Dodge the obstacle by changing lanes or jumping.')}}if(o.position.z>16){scene.remove(o);objects.splice(i,1)}}distance+=speed*dt;score+=dt*8;speed=Math.min(20,10+distance*.0017);if(distance>1200)beginBoss();ui()}
function jump(){if(state===STATE.RUNNING&&jumpY<.03){jumpV=10.8;toast('MAVELI JUMPS!')}}function move(d){if(state===STATE.RUNNING)targetLane=Math.max(0,Math.min(2,targetLane+d))}function reset(){objects.splice(0).forEach(o=>scene.remove(o));score=flowers=distance=0;speed=10;targetLane=1;jumpY=jumpV=0;spawnClock=0;runClock=0;maveli.position.set(0,0,4);maveli.rotation.y=Math.PI;foot.position.set(0,45,-28);shadow.material.opacity=0;ui()}function start(){reset();overlay.classList.add('hidden');state=STATE.RUNNING;pauseBtn.style.display='block';last=performance.now();for(let i=0;i<5;i++)spawn();requestAnimationFrame(loop)}function pause(){if(state===STATE.RUNNING){state=STATE.PAUSED;title.textContent='PAUSED';desc.textContent='The festival road is waiting.';startBtn.textContent='RESUME';overlay.classList.remove('hidden');pauseBtn.style.display='none'}else if(state===STATE.PAUSED){overlay.classList.add('hidden');state=STATE.RUNNING;last=performance.now();pauseBtn.style.display='block';requestAnimationFrame(loop)}}function loop(now){if(state!==STATE.RUNNING&&state!==STATE.BOSS)return;const dt=Math.min(.033,(now-last)/1000);last=now;if(state===STATE.RUNNING)update(dt);else updateBoss(dt);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.position.addScaledVector(p.userData.v,dt);p.userData.v.y-=8*dt;p.userData.life-=dt;p.material.opacity=Math.max(0,p.userData.life);if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}}camera.position.x+=(lanes[targetLane]*.055-camera.position.x)*Math.min(1,dt*5);camera.position.y+=(5.1+jumpY*.035-camera.position.y)*Math.min(1,dt*5);camera.lookAt(maveli.position.x*.12,1.6,-14);if(shake>0){shake=Math.max(0,shake-dt);camera.position.x+=(Math.random()-.5)*shake*.5}renderer.render(scene,camera);requestAnimationFrame(loop)}
function bind(){addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')move(-1);else if(k==='arrowright'||k==='d')move(1);else if(k==='arrowup'||k==='w'||k===' ')jump();else if(k==='p'||k==='escape')pause()});document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const a=b.dataset.act;if(a==='left')move(-1);else if(a==='right')move(1);else if(a==='jump')jump();else pause()}));let sx=0,sy=0;root.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});root.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>35)move(dx>0?1:-1);else if(dy<-25)jump()},{passive:true});startBtn.onclick=()=>state===STATE.PAUSED?pause():start()}
function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,280);camera.position.set(0,5.1,10.5);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;root.appendChild(renderer.domElement);addLights();world();fallback();createFoot();bind();ui();asset('maveli','assets/maveli.gltf').then(useMaveli).catch(e=>console.warn('Maveli GLTF failed, fallback kept',e));asset('train','assets/train.gltf').then(m=>models.train=m).catch(e=>console.warn('Train asset failed',e));asset('foot','assets/vamana-foot.gltf').then(m=>{scene.remove(foot);foot=m.clone(true);foot.position.set(0,45,-28);foot.scale.setScalar(1.15);scene.add(foot)}).catch(e=>console.warn('Foot asset failed',e));renderer.render(scene,camera)}init();})();
</script></body></html>
