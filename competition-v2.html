<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Onam Odyssey — Maveli Run</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79cfe0;font-family:system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0}.hud{position:fixed;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;color:#fff;font-weight:900;pointer-events:none;text-shadow:0 2px 3px #000}.stats{display:flex;gap:6px}.card{background:#052a1cdd;border:1px solid #d4a83b;border-radius:12px;padding:6px 10px}.overlay{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#03150dcc}.menu{text-align:center;width:min(620px,88vw);padding:30px;border:3px solid #d4a83b;border-radius:25px;background:#fff1c5;color:#183526;box-shadow:0 15px 60px #0008}.menu h1{font-size:48px;color:#7c3025;margin:5px}.menu button,.controls button{border:2px solid #a77b21;border-radius:14px;background:linear-gradient(#ffe782,#dcae39);font-weight:1000;padding:13px 20px;box-shadow:0 4px 0 #8c651c}.menu button{font-size:18px;width:80%}.hidden{display:none!important}.controls{position:fixed;z-index:6;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px}.controls button{min-width:68px;min-height:54px;touch-action:none}.jump{min-width:110px!important}.pause{position:fixed;right:12px;bottom:18px;z-index:7}.toast{position:fixed;z-index:10;bottom:95px;left:50%;transform:translateX(-50%);background:#052d1cdd;color:#ffe27a;padding:9px 16px;border-radius:20px;opacity:0;transition:.2s}.toast.show{opacity:1}.hint{font-size:13px;opacity:.8}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/loaders/GLTFLoader.js"></script></head><body><div id="game"></div><div class="hud"><div>🌼 ONAM ODYSSEY<br><small>MAVELI RUN</small></div><div class="stats"><div class="card">🌼 <span id="flowers">0</span></div><div class="card">SCORE <span id="score">0</span></div><div class="card">SPEED <span id="speed">1.0x</span></div></div></div><div class="controls"><button id="left">◀</button><button id="jump" class="jump">JUMP ⤴</button><button id="right">▶</button></div><button id="pause" class="pause hidden">Ⅱ</button><div id="toast" class="toast"></div><div id="overlay" class="overlay"><div class="menu"><div>ഓണാശംസകൾ</div><h1 id="title">MAVELI RUN</h1><p id="desc">A Kerala endless runner. Change lanes, jump obstacles and collect Onam flowers.</p><p class="hint">← → / A D = lanes &nbsp; • &nbsp; SPACE / ↑ = jump &nbsp; • &nbsp; Swipe on mobile</p><button id="start">START RUN</button></div></div><script>(function(){'use strict';var root=document.getElementById('game'),overlay=document.getElementById('overlay'),start=document.getElementById('start'),title=document.getElementById('title'),desc=document.getElementById('desc'),pause=document.getElementById('pause'),toastEl=document.getElementById('toast'),flowerEl=document.getElementById('flowers'),scoreEl=document.getElementById('score'),speedEl=document.getElementById('speed');var scene,camera,renderer,player,clock=0,last=0,state='MENU',lane=1,laneX=[-2.5,0,2.5],jumpY=0,jumpVel=0,run=0,score=0,flowers=0,speed=12,spawn=0,items=[];function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.75})}function box(w,h,d,c){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c))}function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){toastEl.classList.remove('show')},650)}function hud(){flowerEl.textContent=flowers;scoreEl.textContent=Math.floor(score);speedEl.textContent=(speed/12).toFixed(1)+'x'}function makePlayer(){player=new THREE.Group();var body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,6,12),mat(0x1d7046));body.position.y=1.05;var dhoti=new THREE.Mesh(new THREE.CylinderGeometry(.65,.8,.55,14),mat(0xf2dfb0));dhoti.position.y=.55;var head=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),mat(0xb96d43));head.position.y=2.02;var crown=new THREE.Mesh(new THREE.ConeGeometry(.45,.6,8),mat(0xe1b83d));crown.position.y=2.6;player.add(body,dhoti,head,crown);player.position.set(0,0,5);scene.add(player);new THREE.GLTFLoader().load('assets/maveli.gltf',function(g){var m=g.scene,b=new THREE.Box3().setFromObject(m),s=b.getSize(new THREE.Vector3());m.scale.setScalar(3.15/Math.max(.01,s.y));m.rotation.y=Math.PI;m.position.set(0,0,5);m.traverse(function(o){if(o.isMesh){o.castShadow=true;o.material.side=THREE.DoubleSide}});scene.remove(player);player=m;scene.add(player);toast('MAVELI READY')},undefined,function(){})}function makeWorld(){var grass=box(38,.4,300,0x367543);grass.position.set(0,-.35,-120);scene.add(grass);var road=box(9,.2,300,0x5b4029);road.position.set(0,-.1,-120);scene.add(road);for(var x of[-1.25,1.25]){var line=box(.06,.04,300,0xf4dc91);line.position.set(x,.03,-120);scene.add(line)}for(var z=0;z>-290;z-=7){var d=box(8,.035,.2,0xc69b52);d.position.set(0,.04,z);scene.add(d)}for(var z=0;z>-260;z-=22){for(var side of[-1,1]){var trunk=box(.35,4,.35,0x704326);trunk.position.set(side*8,2,z);scene.add(trunk);var crown=new THREE.Mesh(new THREE.SphereGeometry(1.7,8,6),mat(0x246b38));crown.position.set(side*8,4.7,z);scene.add(crown)}}}function spawnItem(){var n=Math.floor(Math.random()*3),o;if(Math.random()<.76){var type=Math.random()<.5?'train':'barricade';o=type==='train'?box(2.2,1.8,4.2,Math.random()<.5?0x345b9b:0x9b342c):box(2.2,1.1,1.7,0xd47b25);o.position.set(laneX[n],type==='train'?0.9:.55,-100);o.userData={kind:'obstacle',type:type}}else{o=new THREE.Mesh(new THREE.TorusGeometry(.38,.12,10,20),mat(0xffcf45));o.position.set(laneX[n],1.5,-100);o.userData={kind:'flower'}}scene.add(o);items.push(o)}function move(d){if(state!=='RUNNING')return;var old=lane;lane=Math.max(0,Math.min(2,lane+d));if(old!==lane)toast(lane===0?'LEFT LANE':lane===2?'RIGHT LANE':'CENTER LANE')}function doJump(){if(state==='RUNNING'&&jumpY<=.01){jumpVel=12;toast('JUMP!')}}function startGame(){state='RUNNING';overlay.classList.add('hidden');pause.classList.remove('hidden');title.textContent='MAVELI RUN';desc.textContent='Change lanes and jump to survive the Onasadya Dash.';start.textContent='START RUN';score=0;flowers=0;speed=12;lane=1;jumpY=0;jumpVel=0;clock=0;spawn=0;items.forEach(function(o){scene.remove(o)});items=[];player.position.set(0,0,5);last=performance.now();hud();requestAnimationFrame(loop)}function pauseGame(){if(state==='RUNNING'){state='PAUSED';overlay.classList.remove('hidden');pause.classList.add('hidden');title.textContent='PAUSED';desc.textContent='The Onam road is waiting. Tap RESUME to continue.';start.textContent='RESUME'}else if(state==='PAUSED'){state='RUNNING';overlay.classList.add('hidden');pause.classList.remove('hidden');last=performance.now();requestAnimationFrame(loop)}}function gameOver(){state='OVER';overlay.classList.remove('hidden');pause.classList.add('hidden');title.textContent='CAUGHT!';desc.textContent='Use lane changes and jumps to dodge the obstacle.';start.textContent='RUN AGAIN'}function animatePlayer(dt){var target=laneX[lane],dx=target-player.position.x;player.position.x+=dx*Math.min(1,dt*18);player.position.y=jumpY;player.rotation.z=Math.max(-.12,Math.min(.12,-dx*.045));var moving=Math.abs(dx)>0.02||jumpY<.01;var bob=moving?Math.sin(clock*16)*.045:0;player.position.y=jumpY+bob;if(player.userData&&player.userData.runParts){var p=player.userData.runParts;p.l.rotation.x=Math.sin(clock*18)*.55;p.r.rotation.x=-Math.sin(clock*18)*.55}}function loop(now){if(state!=='RUNNING')return;var dt=Math.min(.033,(now-last)/1000);last=now;clock+=dt;var target=laneX[lane];animatePlayer(dt);if(jumpY>0||jumpVel>0){jumpY+=jumpVel*dt;jumpVel-=28*dt;if(jumpY<=0){jumpY=0;jumpVel=0}}spawn+=dt;if(spawn>.64){spawn=0;spawnItem()}for(var i=items.length-1;i>=0;i--){var o=items[i];o.position.z+=speed*dt;if(o.userData.kind==='flower'){o.rotation.y+=dt*7;if(o.position.z>3&&o.position.z<7&&Math.abs(o.position.x-player.position.x)<1.2&&Math.abs(o.position.y-(jumpY+1.4))<1.5){flowers++;score+=50;toast('+50 FLOWER');scene.remove(o);items.splice(i,1);continue}}else if(o.position.z>2&&o.position.z<7&&Math.abs(o.position.x-player.position.x)<1.2&&jumpY<1.65){gameOver();return}if(o.position.z>20){scene.remove(o);items.splice(i,1)}}score+=dt*12;speed=Math.min(25,12+score*.004);camera.position.x+=(player.position.x*.2-camera.position.x)*Math.min(1,dt*6);camera.position.y+=(5.2+(jumpY*.12)-camera.position.y)*Math.min(1,dt*5);camera.lookAt(player.position.x*.08,1.5,-17);hud();renderer.render(scene,camera);requestAnimationFrame(loop)}function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x79cfe0);camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,330);camera.position.set(0,5.2,11);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputEncoding=THREE.sRGBEncoding;root.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xfff0cc,0x245b38,2));var sun=new THREE.DirectionalLight(0xfff2d0,3);sun.position.set(-15,25,15);sun.castShadow=true;scene.add(sun);makeWorld();makePlayer();document.getElementById('left').addEventListener('pointerdown',function(e){e.preventDefault();move(-1)});document.getElementById('right').addEventListener('pointerdown',function(e){e.preventDefault();move(1)});document.getElementById('jump').addEventListener('pointerdown',function(e){e.preventDefault();doJump()});start.addEventListener('click',startGame);pause.addEventListener('click',pauseGame);addEventListener('keydown',function(e){var k=e.key.toLowerCase();if(k==='arrowleft'||k==='a'){e.preventDefault();move(-1)}else if(k==='arrowright'||k==='d'){e.preventDefault();move(1)}else if(k==='arrowup'||k==='w'||e.code==='Space'){e.preventDefault();doJump()}else if(k==='p'||e.key==='Escape')pauseGame()});var sx=0,sy=0,tracking=false;root.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse')return;tracking=true;sx=e.clientX;sy=e.clientY});root.addEventListener('pointerup',function(e){if(!tracking)return;tracking=false;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<35)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)doJump()});addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});hud();renderer.render(scene,camera)}init()})();</script></body></html>
